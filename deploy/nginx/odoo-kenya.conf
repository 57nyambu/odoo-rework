# Multi-tenant Odoo: every tenant is served from its own sub-domain,
#   https://<tenant>.pos.dima.co.ke  ->  Odoo database "<tenant>"  (dbfilter ^%d$)
#
# TLS: a wildcard certificate (*.pos.dima.co.ke) needs a DNS-01 challenge,
# e.g. `certbot certonly --dns-cloudflare -d pos.dima.co.ke -d '*.pos.dima.co.ke'`
# (see docs/MULTI_TENANCY.md). Replace pos.dima.co.ke with your domain.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# E-commerce API: 10 requests/second per API key (Authorization header),
# shared by all Odoo workers. Odoo also limits per worker (channel setting).
limit_req_zone $http_authorization zone=ke_api:10m rate=10r/s;
limit_req_status 429;

upstream odoo_kenya {
    server 127.0.0.1:8069;
}
upstream odoo_kenya_ws {
    server 127.0.0.1:8072;
}

server {
    listen 80;
    server_name pos.dima.co.ke *.pos.dima.co.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # The bare domain maps to the database "pos" (dbfilter ^%d$); tenants
    # use their own sub-domain.
    server_name pos.dima.co.ke *.pos.dima.co.ke;

    ssl_certificate     /etc/letsencrypt/live/pos.dima.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.dima.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Odoo picks the tenant database from the Host header.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Never expose the database manager in production (list_db = False too).
    location ~ ^/web/database {
        return 404;
    }

    # POS real-time sync / bus.
    location /websocket {
        proxy_pass http://odoo_kenya_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # REST API for e-commerce platforms.
    location /api/ke/ {
        limit_req zone=ke_api burst=40 nodelay;
        proxy_pass http://odoo_kenya;
    }

    # Safaricom Daraja callbacks (STK result, C2B validation/confirmation).
    # Optionally restrict to Safaricom's published IP ranges here as well
    # (or use the ke_mpesa.allowed_callback_ips system parameter).
    location /ke/lipa/ {
        proxy_pass http://odoo_kenya;
    }

    location / {
        proxy_pass http://odoo_kenya;
    }

    gzip on;
    gzip_types text/css text/plain application/json application/javascript text/xml;
}
